<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Spam Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f1f1f1;
            display: none;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ AI Spam Classifier</h1>

    <p>Paste an SMS message below to check whether it is spam.</p>

    <textarea id="message"
        placeholder="Example: Congratulations! You have won a prize..."></textarea>

    <button onclick="checkSpam()">Check Message</button>

    <div id="result" class="result"></div>

</div>

<script>
async function checkSpam() {

    const message = document.getElementById("message").value;
    const resultBox = document.getElementById("result");

    if (!message.trim()) {
        resultBox.style.display = "block";
        resultBox.innerHTML = "<span class='error'>Please enter a message.</span>";
        return;
    }

    resultBox.style.display = "block";
    resultBox.innerHTML = "Checking...";

    try {

        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        if (!response.ok) {
            resultBox.innerHTML =
                "<span class='error'>" +
                (data.error || "Something went wrong.") +
                "</span>";
            return;
        }

        resultBox.innerHTML = `
            <h3>Result: ${data.prediction}</h3>
            <p>Confidence: ${data.confidence.toFixed(2)}%</p>
            <p>Spam Probability: ${data.spam_probability.toFixed(2)}%</p>
            <p>Not Spam Probability: ${data.ham_probability.toFixed(2)}%</p>
        `;

    } catch (error) {

        resultBox.innerHTML =
            "<span class='error'>Unable to connect to the server.</span>";
    }
}
</script>

</body>
</html>
